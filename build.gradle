unimined.minecraft {
    version project.minecraft_version
    side("client")

    mappings {
        mcp("legacy", "${project.mcp_version}-${project.minecraft_version}")

        stubs(["official", "searge"]) {
            for (String clazzName : relocatedClasses) {
                c(clazzName, "net/minecraft/src/${clazzName}")
            }
            for (String clazzName : forgeClasses) {
                c("forge/${clazzName}", "net/minecraft/src/forge/${clazzName}")
            }
        }

        devNamespace "mcp"
    }

    jarMod {
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    runs {
        config("client") {
            jvmArgs("-Djma.debug=true")
        }
    }
}

unimined.wagYourMaven("releases")

dependencies {
    jarMod "risugami:modloader:${project.minecraft_version}"
    jarMod "modloadermp:modloadermp:${project.minecraft_version}:client"
    jarMod "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}:client@zip"
}


processResources {
}

jar {
    from("Credits.txt")
    from("README-Installation.txt")
}