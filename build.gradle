        stubs(["searge", "mcp"]) {
            c(["net/minecraft/src/BiomeGenBase", "net/minecraft/src/BiomeGenBase"]) {
                m("func_50024_b;()Lnet/minecraft/src/BiomeGenBase;", "setEnableSnow;()Lnet/minecraft/src/BiomeGenBase;")
                m("func_48440_b;(Ljava/util/Random;)Lnet/minecraft/src/WorldGenerator;", "getRandomWorldGenForGrass;(Ljava/util/Random;)Lnet/minecraft/src/WorldGenerator;")
            }
        }
    }

    minecraftForge {
        loader project.forge_version
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    runs {
        config("server") {
            jvmArgs("-Djma.debug=true")
        }
    }
}

dependencies {

}


processClientResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version

    filesMatching("mcmod.info") {
        expand "version": project.version
    }
}

processServerResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version

    filesMatching("mcmod.info") {
        expand "version": project.version
    }
}

clientJar {
    from("MMPL-1.0.txt")
    from("Change Log.txt")
    from("Credits.txt")
    from("Donors.txt")
}

serverJar {
    from("MMPL-1.0.txt")
    from("Change Log.txt")
    from("Credits.txt")
    from("Donors.txt")
}

jar {
    enabled = false
}