plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
}

group 'extrabiomes'
version project.mod_version

base {
    archivesName = 'ExtraBiomesXL'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    sourceCompatibility = JavaVersion.VERSION_1_6
}

tasks.withType(JavaCompile).configureEach {
    options.release = 6
}

sourceSets {
    client {
        java {
            srcDirs("src/common/java", "src/client/java")
        }
        resources {
            srcDirs("src/common/resources", "src/client/resources")
        }
    }
    server {
        java {
            srcDirs("src/common/java", "src/server/java")
        }
        resources {
            srcDirs("src/common/resources", "src/server/resources")
        }
    }
}

repositories {
    unimined.minecraftForgeMaven()
    unimined.wagYourMaven("releases")
    mavenCentral()
    mavenLocal()
}

def relocatedClasses = [
        // ModLoader
        "ModLoader",
        "BaseMod",
        "EntityRendererProxy",
        "ModTextureAnimation",
        "ModTextureStatic",
        // Forge
        "ClientRegistry",
        "FMLRenderAccessLibrary",
        "MLProp",
        "mod_MinecraftForge",
        "SidedProxy",
        "ServerRegistry",

        // ExtraBiomesXL
        "mod_ExtrabiomesXL"
]

