unimined.minecraft(sourceSets.client) {
    version project.minecraft_version
    side("client")

    mappings {
        mcp("legacy", "${project.mcp_version}-${project.minecraft_version}")

        stubs(["official", "searge"]) {
            for (String clazzName : relocatedClasses) {
                c(clazzName, "net/minecraft/src/${clazzName}")
            }
            for (String clazzName : forgeClasses) {
                c("forge/${clazzName}", "net/minecraft/src/forge/${clazzName}")
            }
        }

        stubs(["searge", "mcp"]) {
            c(["net/minecraft/src/BiomeGenBase", "net/minecraft/src/BiomeGenBase"]) {
                m("func_50086_b;()Lnet/minecraft/src/BiomeGenBase;", "setEnableSnow;()Lnet/minecraft/src/BiomeGenBase;")
                m("func_48410_b;(Ljava/util/Random;)Lnet/minecraft/src/WorldGenerator;", "getRandomWorldGenForGrass;(Ljava/util/Random;)Lnet/minecraft/src/WorldGenerator;")
            }
        }
    }

    minecraftForge {
        loader project.forge_version
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    runs {
        config("client") {
            jvmArgs("-Djma.debug=true")
        }
    }
}

unimined.minecraft(sourceSets.server) {
    version project.minecraft_version
    side("server")

    mappings {
        mcp("legacy", "${project.mcp_version}-${project.minecraft_version}")

        stubs(["official", "searge"]) {
            for (String clazzName : relocatedClasses) {
